services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sig_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Triton Inference Server ────────────────────────────────────────────────
  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: sig_triton
    restart: unless-stopped
    command: tritonserver --model-repository=/models --strict-model-config=false --log-verbose=1
    volumes:
      - ./triton/model_repository:/models:ro
    ports:
      - "8010:8000"
      - "8011:8001"
      - "8012:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v2/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── FastAPI Service ────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sig_api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRITON_HOST: triton
      TRITON_HTTP_PORT: 8000
      TRITON_GRPC_PORT: 8001
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      triton:
        condition: service_healthy
    volumes:
      - ./api/app:/app/app:ro

  # ── Frontend (nginx) ───────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: sig_frontend
    restart: unless-stopped
    ports:
      - 8110:80
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      # NOTE: NOT :ro — nginx entrypoint needs to write to this file on startup
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
