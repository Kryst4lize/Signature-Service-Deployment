# Serves the single-page frontend and proxies /api/ to the FastAPI service.
#
# Proxying means the browser can talk to the API same-origin, which sidesteps
# CORS entirely: set the UI's API field to /api and no origin needs allowlisting.
# The direct cross-origin route (http://host:8080) still works for callers that
# want it, governed by CORS_ORIGINS.

server {
    listen 80;
    server_name _;

    # Documents can be large; the API enforces its own cap on top of this.
    client_max_body_size 25m;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        # Resolve the upstream per request through Docker's embedded DNS rather
        # than once at config load. With a literal `proxy_pass http://api:8080`
        # nginx refuses to start while the api container is still coming up
        # ("host not found in upstream"), which turns a slow API start into an
        # nginx crash-loop. Putting the host in a variable defers it.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api;

        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$api_host:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Four GPU inferences per page, so a multi-page PDF can legitimately
        # take minutes. The default 60s read timeout truncates those.
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_request_buffering off;
    }

    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}
