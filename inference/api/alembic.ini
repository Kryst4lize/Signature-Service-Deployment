[alembic]
script_location = migrations
prepend_sys_path = .

# Version files are prefixed with an ordinal so `ls` shows the chain in order;
# the revision ids inside are what alembic actually follows.
file_template = %%(rev)s_%%(slug)s

# The URL is NOT set here. migrations/env.py builds it from the same
# `Settings` the service uses, so the migration and the application can never
# disagree about which database they are talking to, and no credential is
# written to a file that gets committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
